name = "test-hot-app"
compatibility_date = "2025-04-04"
main = "index.js"

# 静态资源配置 - 更新配置方式
[site]
bucket = "./"
include = [
  "*.html",
  "*.css",
  "*.js",
  "*.json",
  "*.png",
  "*.jpg",
  "*.gif",
  "*.svg",
  "*.ico"
]
exclude = [
  "server/node_modules/**/*",
  ".git/**/*",
  "node_modules/**/*",
  "wrangler.toml",
  "package.json",
  "package-lock.json"
]

# 环境变量
[vars]
ENVIRONMENT = "production"

# 修改入口点配置
[build]
command = ""
watch_dir = ["server", "."]

# 开发配置
[dev]
port = 8787
local_protocol = "http" 